  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }

  <main>
    <p><a href="./">← FileRenamer</a></p>
    <h1>更新履歴</h1>
    <h2>1.1.1</h2>
    <ul>
      <li>起動時に更新機能のライブラリを読み込めない問題を修正しました。</li>
      <li>類似画像の確認画面から、選んだファイルだけをFinderのゴミ箱へ移動できるようになりました。</li>
      <li>RAW＋JPEGなどの関連ファイルは、まとめて安全に扱います。</li>
      <li>個別に追加したファイルでも、プレビューとゴミ箱への移動を安定して行えるようになりました。</li>
      <li>メニューからアップデートを確認できるようになりました。</li>
    </ul>
  </main>
