<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>更新履歴 — FileRenamer</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    body { margin: 0; line-height: 1.75; background: Canvas; color: CanvasText; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; }
    h1 { line-height: 1.2; letter-spacing: -0.03em; }
    h2 { margin-top: 2em; }
    li { color: color-mix(in srgb, CanvasText 78%, transparent); }
    a { color: LinkText; }
  </style>
</head>
<body>
  <main>
    <p><a href="./">← FileRenamer</a></p>
    <h1>更新履歴</h1>
    <h2>1.1.2</h2>
    <ul>
      <li>リストとグリッドで、クリック・⌘クリック・⇧クリックによる複数選択に対応しました。</li>
      <li>複数選択時は、ゴミ箱への移動やリストからの除外に対象件数を表示します。</li>
      <li>右クリックから、選択した複数のファイルをまとめてFinderのゴミ箱へ移動できます。</li>
      <li>個別ファイルを追加した直後に、リネームに必要なフォルダアクセスを許可できるようにしました。</li>
      <li>標準プリセットに「01納品」「001納品」を追加し、「01納品」を既定にしました。</li>
    </ul>
  </main>
</body>
</html>
