name: macOS build and safety tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Safety tests
        run: swift run RenameKitTests
      - name: Release build
        run: >-
          xcodebuild -project FileRenamer.xcodeproj -scheme FileRenamer
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath .derivedData CODE_SIGNING_ALLOWED=NO build
